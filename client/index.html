<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS 553 Task Manager</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main>
      <h1>CS 553 Task Manager</h1>

      <section>
        <h2>Login</h2>
        <form id="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="submit">Log In</button>
          <button id="logout" type="button">Log Out</button>
        </form>
        <p id="identity">Not logged in.</p>
        <p>
          Demo accounts: <code>user</code> / <code>user-password</code> and
          <code>admin</code> / <code>admin-password</code>.
        </p>
      </section>

      <section>
        <h2>Tasks</h2>
        <p style="color: blue;"><b>Signed-in users can list tasks.</b></p>
        <button id="load-items">Load Tasks</button>
        <ul id="items"></ul>
      </section>

      <section>
        <h2>Delete Task</h2>
        <p style="color: red;"><b>Only admins can delete tasks.</b></p>
        <form id="delete-item-form">
          <label for="item-nbr">Task Number</label>
          <input id="item-nbr" name="item-nbr" required />
          <button type="submit">Delete</button>
        </form>
      </section>

      <section>
        <h2>Status</h2>
        <pre id="status">Ready.</pre>
      </section>
    </main>
  </body>
</html>
